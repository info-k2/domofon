# Единая точка входа без TLS (LAN / Synology Reverse Proxy → :8080).
# Для режима «только 443» entrypoint подставит nginx.conf.template.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    client_max_body_size 16m;

    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream domofon_bridge {
        server bridge:8787;
    }

    upstream domofon_webrtc {
        server mediamtx:8889;
    }

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        location /health { proxy_pass http://domofon_bridge; }
        location /v1/    { proxy_pass http://domofon_bridge; }
        location /door   { proxy_pass http://domofon_webrtc; }
        location / {
            default_type text/plain;
            return 200 "domofon edge\n/v1/* /health -> bridge\n/door* -> MediaMTX\n";
        }
    }
}
