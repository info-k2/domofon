services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - domofon

  bridge:
    build: ./bridge
    container_name: domofon-bridge
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      APK_DIR: /data/apk
    volumes:
      - ./bridge-data:/data
      - ./apk:/data/apk:ro
    networks:
      - domofon

  edge:
    image: nginx:1.27-alpine
    container_name: domofon-edge
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      bridge:
        condition: service_started
    networks:
      - domofon

networks:
  domofon:
    driver: bridge
