services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  bridge:
    build: ./bridge
    container_name: domofon-bridge
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./bridge-data:/data
